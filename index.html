<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBox Pro - Katalog Film</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e50914;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #b20710;
        }
        .movie-card {
            background: #2a2a2a;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            border-left: 4px solid #e50914;
        }
        .movie-card h3 {
            margin: 0 0 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>StreamBox Pro 🎬</h1>
        
        <!-- Form Tambah Film -->
        <div class="form-group">
            <h3>Tambah Film Baru</h3>
            <input type="text" id="movieTitle" placeholder="Judul Film">
            <textarea id="movieDesc" placeholder="Deskripsi Singkat Film" rows="3"></textarea>
            <button id="saveBtn">Simpan ke Database</button>
        </div>

        <hr style="border-color: #444; margin: 20px 0;">

        <!-- Daftar Film dari Database -->
        <h3>Daftar Film Tersimpan</h3>
        <div id="movie-list">Memuat data film...</div>
    </div>

    <!-- Script Koneksi Firebase & Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase milik kamu
        const firebaseConfig = {
            apiKey: "AIzaSyCLQSs9rc3Dre6BqdjOUoyOuoUEIYHwnt0",
            authDomain: "streambox-pro-7a814.firebaseapp.com",
            projectId: "streambox-pro-7a814",
            storageBucket: "streambox-pro-7a814.firebasestorage.app",
            messagingSenderId: "671724281229",
            appId: "1:671724281229:web:a25b5aa7d208a88f0a71c4",
            measurementId: "G-NTBGKRXVJV"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const movieTitleInput = document.getElementById("movieTitle");
        const movieDescInput = document.getElementById("movieDesc");
        const saveBtn = document.getElementById("saveBtn");
        const movieListDiv = document.getElementById("movie-list");

        // Fungsi Ambil Data Film dari Firestore
        async function loadMovies() {
            movieListDiv.innerHTML = "Memuat data...";
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                movieListDiv.innerHTML = "";
                
                if (querySnapshot.empty) {
                    movieListDiv.innerHTML = "<p>Belum ada film yang tersimpan.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const movie = doc.data();
                    movieListDiv.innerHTML += `
                        <div class="movie-card">
                            <h3>${movie.title}</h3>
                            <p>${movie.description}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Gagal memuat film: ", error);
                movieListDiv.innerHTML = "<p>Gagal memuat data dari database.</p>";
            }
        }

        // Fungsi Simpan Film ke Firestore
        saveBtn.addEventListener("click", async () => {
            const title = movieTitleInput.value.trim();
            const description = movieDescInput.value.trim();

            if (!title || !description) {
                alert("Judul dan deskripsi tidak boleh kosong!");
                return;
            }

            try {
                saveBtn.innerText = "Menyimpan...";
                await addDoc(collection(db, "movies"), {
                    title: title,
                    description: description,
                    createdAt: new Date()
                });

                movieTitleInput.value = "";
                movieDescInput.value = "";
                alert("Film berhasil disimpan ke database cloud!");
                loadMovies();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Gagal menyimpan film.");
            } finally {
                saveBtn.innerText = "Simpan ke Database";
            }
        });

        // Jalankan saat pertama kali dibuka
        loadMovies();
    </script>
</body>
</html>
