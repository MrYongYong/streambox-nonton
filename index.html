<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NontonID - Streaming Film & Serial TV Gratis Terlengkap</title>
  
  <!-- Video.js CSS & FontAwesome Icons -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-body: #0a0d14;
      --bg-sidebar: #111622;
      --bg-card: #161c2e;
      --accent-blue: #2563eb;
      --accent-red: #e50914;
      --accent-gold: #fbbf24;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* 1. SIDEBAR LEFT (NONTONID) */
    aside { width: 250px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; transition: 0.3s; overflow-y: auto; }
    .brand { padding: 1.5rem; font-size: 1.6rem; font-weight: 900; color: var(--accent-blue); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
    .brand span { color: #fff; }
    
    .menu-group { padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .menu-title { padding: 0.5rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 0.7rem 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: 0.2s; cursor: pointer; }
    .nav-link:hover, .nav-link.active { color: #fff; background: rgba(37, 99, 235, 0.15); border-left: 4px solid var(--accent-blue); }

    /* 2. MAIN CONTENT AREA */
    main { margin-left: 250px; flex: 1; padding: 1.5rem 2rem; width: calc(100% - 250px); }

    /* Top Search Header */
    .top-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; background: rgba(22, 28, 46, 0.6); padding: 0.8rem 1.2rem; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid var(--border-color); }
    .search-bar { display: flex; align-items: center; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 20px; padding: 0.4rem 1rem; width: 380px; }
    .search-bar input { background: transparent; border: none; outline: none; color: #fff; padding-left: 8px; width: 100%; font-size: 0.85rem; }
    
    .profile-badge { display: flex; align-items: center; gap: 10px; background: var(--bg-body); padding: 0.4rem 0.8rem; border-radius: 20px; border: 1px solid var(--border-color); font-size: 0.85rem; }
    .profile-badge select { background: transparent; border: none; color: #fff; outline: none; cursor: pointer; font-size: 0.85rem; }

    /* Player Area (Tersembunyi Sebelum Film Dipilih) */
    .player-wrapper { display: none; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 12px 35px rgba(0,0,0,0.6); margin-bottom: 2rem; }
    .video-js { width: 100% !important; height: 480px !important; }
    
    .player-controls-bar { background: var(--bg-card); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-action { background: #1f293d; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-action:hover { background: var(--accent-blue); }

    /* Filter Bar Kategori Lengkap */
    .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 0.8rem; margin-bottom: 1.5rem; scrollbar-width: thin; }
    .filter-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    /* Grid Poster Film (Fokus Utama Beranda) */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .section-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent-blue); border-radius: 2px; }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.3rem; margin-bottom: 2.5rem; }
    
    .movie-card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); position: relative; transition: all 0.3s ease; cursor: pointer; }
    .movie-card:hover { transform: translateY(-6px); border-color: var(--accent-blue); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); }
    
    .poster-box { position: relative; width: 100%; height: 250px; overflow: hidden; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .movie-card:hover .poster-box img { transform: scale(1.06); }

    /* Badges khas NontonID */
    .badge-quality { position: absolute; top: 8px; left: 8px; background: var(--accent-blue); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 3px 7px; border-radius: 4px; text-transform: uppercase; }
    .badge-rating { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: var(--accent-gold); font-size: 0.7rem; font-weight: 700; padding: 3px 7px; border-radius: 4px; display: flex; align-items: center; gap: 3px; }
    
    .card-info { padding: 12px; }
    .card-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .card-sub { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

    /* Responsive Design */
    @media (max-width: 900px) {
      aside { width: 70px; }
      aside .brand span, aside .menu-title, aside .nav-link span { display: none; }
      main { margin-left: 70px; width: calc(100% - 70px); padding: 1rem; }
      .search-bar { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 1. SIDEBAR NAVIGASI (NONTONID) -->
  <aside>
    <div class="brand">
      <i class="fa-solid fa-play-circle"></i> <span>Nonton<span>ID</span></span>
    </div>
    
    <div class="menu-group">
      <div class="menu-title">Menu Utama</div>
      <a class="nav-link active" onclick="setCategoryFilter('')"><i class="fa-solid fa-house"></i> <span>Beranda</span></a>
      <a class="nav-link" onclick="setCategoryFilter('Trending')"><i class="fa-solid fa-fire"></i> <span>Trending ID</span></a>
      <a class="nav-link" onclick="setCategoryFilter('Bioskop')"><i class="fa-solid fa-film"></i> <span>Film Bioskop</span></a>
      <a class="nav-link" onclick="setCategoryFilter('Serial')"><i class="fa-solid fa-tv"></i> <span>Serial TV</span></a>
      <a class="nav-link" onclick="setCategoryFilter('Anime')"><i class="fa-solid fa-dragon"></i> <span>Anime</span></a>
    </div>

    <div class="menu-group">
      <div class="menu-title">Kategori Lengkap</div>
      <a class="nav-link" onclick="setGenreFilter('Aksi')"><i class="fa-solid fa-gun"></i> <span>Aksi</span></a>
      <a class="nav-link" onclick="setGenreFilter('Petualangan')"><i class="fa-solid fa-compass"></i> <span>Petualangan</span></a>
      <a class="nav-link" onclick="setGenreFilter('Animasi')"><i class="fa-solid fa-child"></i> <span>Animasi</span></a>
      <a class="nav-link" onclick="setGenreFilter('Komedi')"><i class="fa-solid fa-face-laugh-beam"></i> <span>Komedi</span></a>
      <a class="nav-link" onclick="setGenreFilter('Kejahatan')"><i class="fa-solid fa-handcuffs"></i> <span>Kejahatan</span></a>
      <a class="nav-link" onclick="setGenreFilter('Dokumenter')"><i class="fa-solid fa-camera-retro"></i> <span>Dokumenter</span></a>
      <a class="nav-link" onclick="setGenreFilter('Drama')"><i class="fa-solid fa-masks-theater"></i> <span>Drama</span></a>
      <a class="nav-link" onclick="setGenreFilter('Horor')"><i class="fa-solid fa-ghost"></i> <span>Horor</span></a>
      <a class="nav-link" onclick="setGenreFilter('Misteri')"><i class="fa-solid fa-magnifying-glass"></i> <span>Misteri</span></a>
      <a class="nav-link" onclick="setGenreFilter('Romantis')"><i class="fa-solid fa-heart"></i> <span>Romantis</span></a>
      <a class="nav-link" onclick="setGenreFilter('Sci-Fi')"><i class="fa-solid fa-robot"></i> <span>Sci-Fi</span></a>
      <a class="nav-link" onclick="setGenreFilter('Thriller')"><i class="fa-solid fa-skull"></i> <span>Thriller</span></a>
    </div>
  </aside>

  <!-- 2. KONTEN UTAMA -->
  <main>
    <!-- Top Search Header -->
    <div class="top-header">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="searchInput" placeholder="Cari film, serial, aktor, atau genre..." oninput="filterMovies()">
      </div>
      
      <div class="profile-badge">
        <i class="fa-solid fa-user-shield" style="color: var(--accent-blue);"></i>
        <select id="profileSelect" onchange="switchProfile(this.value)">
          <option value="adult">Mode Dewasa</option>
          <option value="kids">Kids Mode</option>
        </select>
      </div>
    </div>

    <!-- Pemutar Video (Muncul Saat Poster Film Diklik) -->
    <div class="player-wrapper" id="playerWrapper">
      <video id="mainPlayer" class="video-js vjs-big-play-centered" controls preload="auto" crossorigin="anonymous">
        <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegURL">
        <track kind="captions" src="data:text/vtt;charset=utf-8,WEBVTT%0A%0A1%0A00:00:01.000%20--%3E%2000:00:05.000%0ASelamat%20Menonton%20di%20NontonID" srclang="id" label="Bahasa Indonesia" default>
      </video>

      <div class="player-controls-bar">
        <div style="display: flex; gap: 8px;">
          <button class="btn-action" onclick="skipIntro()"><i class="fa-solid fa-forward"></i> Skip Intro</button>
          <button class="btn-action" onclick="togglePiP()"><i class="fa-solid fa-window-restore"></i> PiP</button>
          <button class="btn-action" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i> Tutup Player</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Kecepatan:</span>
          <select class="btn-action" onchange="changeSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
          <button class="btn-action" style="background: var(--accent-blue);" onclick="downloadOffline()"><i class="fa-solid fa-download"></i> Unduh</button>
        </div>
      </div>
    </div>

    <!-- Filter Genre Cepat -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setGenreFilter('')">Semua Genre</button>
      <button class="filter-btn" onclick="setGenreFilter('Aksi')">Aksi</button>
      <button class="filter-btn" onclick="setGenreFilter('Petualangan')">Petualangan</button>
      <button class="filter-btn" onclick="setGenreFilter('Animasi')">Animasi</button>
      <button class="filter-btn" onclick="setGenreFilter('Komedi')">Komedi</button>
      <button class="filter-btn" onclick="setGenreFilter('Drama')">Drama</button>
      <button class="filter-btn" onclick="setGenreFilter('Horor')">Horor</button>
      <button class="filter-btn" onclick="setGenreFilter('Romantis')">Romantis</button>
      <button class="filter-btn" onclick="setGenreFilter('Sci-Fi')">Sci-Fi</button>
      <button class="filter-btn" onclick="setGenreFilter('Thriller')">Thriller</button>
    </div>

    <!-- Grid Poster Beranda Utama -->
    <div class="section-header">
      <div class="section-title" id="gridTitle">Katalog Film Terpopuler</div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>

    <!-- Grid Bookmark / Tonton Nanti -->
    <div class="section-header">
      <div class="section-title">Daftar Tonton Nanti (Bookmark)</div>
    </div>
    <div class="movie-grid" id="watchlistGrid"></div>
  </main>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    // Database Film Lengkap Khas NontonID
    const moviesDatabase = [
      {
        id: "m1",
        title: "Sintel (2021)",
        genre: "Petualangan",
        category: "Bioskop",
        quality: "HD 1080p",
        rating: "8.5",
        ratingAge: "13+",
        poster: "https://upload.wikimedia.org/wikipedia/commons/f/f8/Sintel_poster.jpg",
        streamUrl: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
      },
      {
        id: "m2",
        title: "Tears of Steel (2022)",
        genre: "Sci-Fi",
        category: "Bioskop",
        quality: "4K UHD",
        rating: "7.9",
        ratingAge: "18+",
        poster: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Tears_of_Steel_poster.jpg",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "m3",
        title: "Big Buck Bunny",
        genre: "Animasi",
        category: "Anime",
        quality: "FULL HD",
        rating: "9.0",
        ratingAge: "SU",
        poster: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",
        streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      }
    ];

    let player;
    let selectedGenre = '';
    let selectedCategory = '';
    let currentProfile = 'adult';
    let watchlist = JSON.parse(localStorage.getItem('nontonid_watchlist')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      player = videojs('mainPlayer', { responsive: true });
      renderMovies(moviesDatabase);
      renderWatchlist();
    });

    /* Kontrol Player */
    function playMovie(movie) {
      document.getElementById('playerWrapper').style.display = 'block';
      player.src({ src: movie.streamUrl, type: movie.streamUrl.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
      player.play();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      player.pause();
      document.getElementById('playerWrapper').style.display = 'none';
    }

    function skipIntro() { player.currentTime(player.currentTime() + 85); }
    function changeSpeed(val) { player.playbackRate(parseFloat(val)); }
    function togglePiP() {
      const v = document.querySelector('video');
      if (v) document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture();
    }
    function downloadOffline() { alert('Mulai mengunduh file video...'); }

    /* Filter & Search */
    function setGenreFilter(genre) {
      selectedGenre = genre;
      filterMovies();
    }

    function setCategoryFilter(cat) {
      selectedCategory = cat;
      document.getElementById('gridTitle').innerText = cat ? `Kategori: ${cat}` : 'Katalog Film Terpopuler';
      filterMovies();
    }

    function filterMovies() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = moviesDatabase.filter(m => {
        const matchTitle = m.title.toLowerCase().includes(query) || m.genre.toLowerCase().includes(query);
        const matchGenre = selectedGenre === '' || m.genre === selectedGenre;
        const matchCategory = selectedCategory === '' || m.category === selectedCategory || (selectedCategory === 'Trending' && parseFloat(m.rating) >= 8.0);
        const matchKids = currentProfile !== 'kids' || m.ratingAge === 'SU';
        return matchTitle && matchGenre && matchCategory && matchKids;
      });
      renderMovies(filtered);
    }

    function switchProfile(val) {
      currentProfile = val;
      filterMovies();
    }

    function toggleWatchlist(id) {
      if (watchlist.includes(id)) {
        watchlist = watchlist.filter(item => item !== id);
      } else {
        watchlist.push(id);
      }
      localStorage.setItem('nontonid_watchlist', JSON.stringify(watchlist));
      renderWatchlist();
      filterMovies();
    }

    /* Render UI Grid Poster */
    function renderMovies(list) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; grid-column: span 4;">Film tidak ditemukan.</p>';
        return;
      }
      list.forEach(m => {
        const isFav = watchlist.includes(m.id);
        grid.innerHTML += `
          <div class="movie-card" onclick="playMovie(moviesDatabase.find(item => item.id === '${m.id}'))">
            <div class="poster-box">
              <span class="badge-quality">${m.quality}</span>
              <span class="badge-rating"><i class="fa-solid fa-star"></i> ${m.rating}</span>
              <img src="${m.poster}" alt="${m.title}">
            </div>
            <div class="card-info">
              <div class="card-title">${m.title}</div>
              <div class="card-sub">
                <span>${m.genre}</span>
                <i class="fa-${isFav ? 'solid' : 'regular'} fa-bookmark" 
                   style="color: ${isFav ? 'var(--accent-blue)' : 'var(--text-muted)'}; cursor: pointer;" 
                   onclick="event.stopPropagation(); toggleWatchlist('${m.id}')"></i>
              </div>
            </div>
          </div>
        `;
      });
    }

    function renderWatchlist() {
      const grid = document.getElementById('watchlistGrid');
      grid.innerHTML = '';
      const favs = moviesDatabase.filter(m => watchlist.includes(m.id));
      if (favs.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); font-size: 0.8rem;">Belum ada tontonan tersimpan.</p>';
        return;
      }
      favs.forEach(m => {
        grid.innerHTML += `
          <div class="movie-card" onclick="playMovie(moviesDatabase.find(item => item.id === '${m.id}'))">
            <div class="poster-box">
              <span class="badge-quality">${m.quality}</span>
              <img src="${m.poster}">
            </div>
            <div class="card-info">
              <div class="card-title">${m.title}</div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
